# Тесты и (необязательно) выкладка сайта отчётов на хостинг по FTP.
# Основной способ обновления сайта - самообновление: сайт сам скачивает код из main после того,
# как здесь прошли тесты (страница «Настройки» → «Обновление кода сайта»).
# Выкладка по FTP выполняется, только если в переменных репозитория задано DEPLOY_METHOD = ftp.
# Срабатывает при изменении ветки main (после слияния изменений) и вручную: Actions -> «Выкладка сайта» -> Run workflow.
# В pull request в main запускаются только тесты.
# Нужные секреты репозитория (Settings -> Secrets and variables -> Actions):
#   FTP_SERVER    - адрес FTP-сервера хостинга, например ftp.example.ru
#   FTP_USERNAME  - логин FTP
#   FTP_PASSWORD  - пароль FTP
#   FTP_DIR       - папка сайта на сервере, со слешем на конце, например public_html/ или report.example.ru/public_html/
# Необязательные переменные (там же, вкладка Variables):
#   FTP_PROTOCOL  - ftps (по умолчанию) или ftp, если хостинг не поддерживает шифрование
#   FTP_SECURITY  - strict (по умолчанию) или loose, если сертификат FTPS выдан на другое имя сервера
name: Выкладка сайта

on:
  push:
    branches: [main]
    paths: ['site/**', 'tests/**', '.github/workflows/deploy.yml']
  # Для pull request в main - только тесты (выкладка идёт лишь из main), чтобы ошибки были видны до слияния
  pull_request:
    branches: [main]
    paths: ['site/**', 'tests/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

concurrency:
  group: deploy-site-${{ github.ref }}   # выкладки из main идут строго по очереди; тесты PR их не вытесняют
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Тесты (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, openssl, mbstring, json
          coverage: none
      - name: Проверка синтаксиса
        run: find site tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Автотесты
        run: php tests/run.php

  deploy:
    name: Выкладка по FTP
    needs: test
    if: github.ref == 'refs/heads/main' && vars.DEPLOY_METHOD == 'ftp'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Версия
        run: echo "$(date -u +%Y-%m-%d) ${GITHUB_SHA::7}" > site/VERSION && cat site/VERSION
      - name: Загрузка изменённых файлов
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          # strict - проверять сертификат FTPS (по умолчанию). loose - только если сертификат выдан на другое имя сервера
          security: ${{ vars.FTP_SECURITY || 'strict' }}
          local-dir: ./site/
          server-dir: ${{ secrets.FTP_DIR }}
          # Никогда не трогаем ключи и данные на сервере
          exclude: |
            **/.git*
            **/.git*/**
            config.php
            data/**
