# Выкладка сайта отчётов на хостинг.
# Срабатывает при изменении ветки main (после слияния изменений) и вручную: Actions -> «Выкладка сайта» -> Run workflow.
# В pull request в main запускаются только тесты.
# Нужные секреты репозитория (Settings -> Secrets and variables -> Actions):
#   FTP_SERVER    - адрес FTP-сервера хостинга, например ftp.example.ru
#   FTP_USERNAME  - логин FTP
#   FTP_PASSWORD  - пароль FTP
#   FTP_DIR       - папка сайта на сервере, со слешем на конце, например public_html/ или report.example.ru/public_html/
# Необязательные переменные (там же, вкладка Variables):
#   FTP_PROTOCOL  - ftps (по умолчанию) или ftp, если хостинг не поддерживает шифрование
#   FTP_SECURITY  - strict (по умолчанию) или loose, если сертификат FTPS выдан на другое имя сервера
#   SITE_URL      - адрес сайта, например https://report.example.ru - для проверки после выкладки
name: Выкладка сайта

on:
  push:
    branches: [main]
    paths: ['site/**', 'tests/**', '.github/workflows/deploy.yml']
  # Для pull request в main - только тесты (выкладка идёт лишь из main), чтобы ошибки были видны до слияния
  pull_request:
    branches: [main]
    paths: ['site/**', 'tests/**', '.github/workflows/deploy.yml']
  workflow_dispatch:

concurrency:
  group: deploy-site-${{ github.ref }}   # выкладки из main идут строго по очереди; тесты PR их не вытесняют
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: Тесты (PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php: ['7.4', '8.3']
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: curl, openssl, mbstring, json
          coverage: none
      - name: Проверка синтаксиса
        run: find site tests -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Автотесты
        run: php tests/run.php

  deploy:
    name: Выкладка по FTP
    needs: test
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - name: Версия
        run: echo "$(date -u +%Y-%m-%d) ${GITHUB_SHA::7}" > site/VERSION && cat site/VERSION
      - name: Загрузка изменённых файлов
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ${{ vars.FTP_PROTOCOL || 'ftps' }}
          # strict - проверять сертификат FTPS (по умолчанию). loose - только если сертификат выдан на другое имя сервера
          security: ${{ vars.FTP_SECURITY || 'strict' }}
          local-dir: ./site/
          server-dir: ${{ secrets.FTP_DIR }}
          # Никогда не трогаем ключи и данные на сервере
          exclude: |
            **/.git*
            **/.git*/**
            config.php
            data/**
      - name: Проверка сайта после выкладки
        if: vars.SITE_URL != ''
        env:
          SITE_URL: ${{ vars.SITE_URL }}
        run: |
          url="${SITE_URL%/}"            # слеш на конце адреса не нужен
          expected="$(cat site/VERSION)"
          code=""
          for i in 1 2 3 4 5; do
            code="$(curl -sS -o health.out -w '%{http_code}' "$url/health.php" || true)"
            got="$(sed -n 's/.*"version":"\([^"]*\)".*/\1/p' health.out 2>/dev/null || true)"
            echo "Попытка $i: $url/health.php -> HTTP $code, версия на сайте: '${got}', ожидается: '${expected}'"
            [ "$got" = "$expected" ] && exit 0
            sleep 10
          done
          # Диагностика: сравниваем статические файлы сайта на сервере с только что выложенными
          same() { curl -sS -o remote.tmp -w '%{http_code}' "$url/$1" >/dev/null 2>&1 || true; cmp -s remote.tmp "site/$1"; }
          robots="$(curl -sS -o /dev/null -w '%{http_code}' "$url/robots.txt" || true)"
          ours=no; same robots.txt && same assets/nav.js && ours=yes
          echo "Диагностика: $url/robots.txt -> HTTP $robots; статические файлы совпадают с выложенными: $ours"
          if [ "$code" = "404" ] && [ "$ours" = "yes" ]; then
            echo "::error::Файлы сайта лежат в нужной папке (статические файлы открываются), но PHP-файлы отвечают 404. Сервер не исполняет PHP в этой папке: проверьте в панели хостинга, что для сайта включён PHP (обработчик PHP), и нет ли в родительских папках (.htaccess, настройки CMS основного сайта) правил, которые перехватывают *.php - см. DEPLOY.md, раздел «Если что-то не так»."
          elif [ "$code" = "404" ]; then
            echo "::error::По адресу $url файлов сайта нет (HTTP 404). Файлы загружены в папку FTP_DIR, но SITE_URL указывает на другую папку. Сверьте FTP_DIR и SITE_URL (регистр букв в пути важен) - см. DEPLOY.md, раздел «Если что-то не так»."
          elif [ "$code" = "500" ]; then
            echo "::error::Сайт найден, но PHP выдаёт ошибку 500. Чаще всего на сервере нет config.php или у PHP нет нужных расширений - см. журнал ошибок в панели хостинга."
          elif [ "$code" = "200" ]; then
            echo "::error::Сайт отвечает, но версия '${got}' не совпадает с '${expected}': файлы, вероятно, загружаются в другую папку, чем та, что открывается по SITE_URL."
          else
            echo "::error::Сайт не ответил новой версией (HTTP $code) - проверьте журнал выкладки и сайт."
          fi
          exit 1
