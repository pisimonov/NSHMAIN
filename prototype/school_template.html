<style>/*CSS*/
/* --- экономика школы --- */
.demo-banner{background:var(--warn-bg);border-radius:8px;padding:8px 12px;font-size:12.5px;color:var(--ink);margin:12px 0}
.seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:8px;overflow:hidden}
.seg button{border:0;background:var(--surface);color:var(--ink-2);font:inherit;font-size:12.5px;padding:5px 10px;cursor:pointer}
.seg button+button{border-left:1px solid var(--border)}
.seg button.on{background:var(--s1-wash);color:var(--ink);font-weight:600}
.grid-tiles.four{grid-template-columns:repeat(4,minmax(0,1fr))}
@media (max-width:1100px){.grid-tiles.four{grid-template-columns:repeat(2,minmax(0,1fr))}}
.val.neg{color:var(--bad)} .val.pos{color:var(--good)}
.bar-track{position:relative;height:22px;background:var(--surface-2);border-radius:4px}
.bar-meter{position:absolute;left:0;top:0;bottom:0;border-radius:0 4px 4px 0;background:var(--s1)}
.bar-plan{position:absolute;top:-4px;bottom:-4px;width:0;border-left:2px dashed var(--ink-2)}
/* воронка */
.fn{display:grid;grid-template-columns:200px minmax(260px,1fr) 120px 210px;column-gap:14px;align-items:center}
.fn .hd{font-size:12px;color:var(--muted);padding-bottom:6px}
.fn .st{font-size:13.5px;font-weight:600}
.fn .st small{display:block;font-weight:400;color:var(--muted);font-size:11.5px}
.fn .v{text-align:right;font-variant-numeric:tabular-nums;font-size:15px;font-weight:650}
.fn .cmp{font-size:12.5px;color:var(--ink-2);font-variant-numeric:tabular-nums}
.fn .track{position:relative;height:24px}
.fn .fill{position:absolute;left:0;top:0;bottom:0;background:var(--s1);border-radius:0 4px 4px 0;min-width:2px}
.fn .ghost{position:absolute;left:0;top:-3px;bottom:-3px;border:2px dashed var(--ink-2);border-left:0;border-radius:0 5px 5px 0;pointer-events:none}
.fn .row{display:contents}
.fn .row>*{padding:7px 0}
.fn .row:hover>*{background:var(--hl)}
.fn .cv{grid-column:1 / -1;display:grid;grid-template-columns:200px minmax(260px,1fr) 120px 210px;column-gap:14px;align-items:center;font-size:12.5px;color:var(--ink-2)}
.fn .cv .arrow{color:var(--muted);padding-left:18px}
.fn .cv .rate{font-weight:650;color:var(--ink);font-variant-numeric:tabular-nums}
.fn .sep{grid-column:1 / -1;border-top:1px solid var(--grid);margin:8px 0 4px}
.chip .ic{font-size:9px}
.cmp-tbl td.best{font-weight:650}
.wf-legend span i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:5px}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:1100px){.twocol{grid-template-columns:1fr}}
.method ul{margin:6px 0 12px 18px;padding:0;font-size:13px;line-height:1.55}
.method h3{margin:14px 0 4px;font-size:14px}
.q{background:var(--surface-2);border-radius:8px;padding:10px 14px;font-size:13px;margin:8px 0}
</style>

  <label>Сравнить с <span class="seg" id="f-cmp"><button data-v="prev">Прошлый месяц</button><button data-v="dir">Направление</button><button data-v="ref">Эталон</button></span></label>
</div>

<div class="wrap"><main id="main"></main></div><div id="tip"></div>
<script>
"use strict";
/* =====================================================================
   ДЕМО-ДАННЫЕ. Структура = то, что сайт будет получать из таблиц:
   по каждой школе и дню: лиды, постановки, встречи, первые продажи (шт.),
   новые продажи (₽), старые продажи (₽); план месяца: лиды и выручка;
   эталон по направлению: конверсии и средний чек.
   ===================================================================== */
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}
function binom(r,n,p){let k=0;for(let i=0;i<n;i++)if(r()<p)k++;return k;}
function pois(r,m){let L=Math.exp(-m),k=0,p=1;do{k++;p*=r();}while(p>L);return k-1;}
const TODAY='2026-11-20', CUR={y:2026,m:10,n:30}, PREV={y:2026,m:9,n:31};   // m - с нуля: ноябрь и октябрь
const D=19;                                                              // срез - вчера (как в отчёте по выручке)
const DOW=[.7,1.15,1.1,1.05,1.1,1,.8];                                   // вс..сб: сезонность лидов по дням недели
function genMonth(seed,mo,p){
  const r=rng(seed), o={L:[],B:[],M:[],S:[],NR:[],OR:[]};
  for(let d=1;d<=mo.n;d++){
    const w=DOW[new Date(mo.y,mo.m,d).getDay()];
    const L=pois(r,p.lead*w), B=binom(r,L,p.cr1), M=binom(r,B,p.cr2), S=binom(r,M,p.cr3);
    let nr=0;for(let i=0;i<S;i++)nr+=Math.round(p.chk*(0.75+r()*0.5)/100)*100;
    const early=d<=10?1.45:0.75;                                           // продления ученикам - в начале месяца
    o.L.push(L);o.B.push(B);o.M.push(M);o.S.push(S);o.NR.push(nr);o.OR.push(Math.round(p.old*early*(0.6+r()*0.8)/100)*100);
  }
  return o;
}
const DIRS={
  'Гитара':  {ref:{cr1:.62,cr2:.75,cr3:.40,chk:28000}},
  'Вокал':   {ref:{cr1:.60,cr2:.72,cr3:.38,chk:26000}},
  'Барабаны':{ref:{cr1:.58,cr2:.74,cr3:.42,chk:30000}},
};
const SCHOOLS=[];
let seed=11;
Object.keys(DIRS).forEach((dir,di)=>{
  for(let i=0;i<8;i++){
    const r=rng(seed+=7), main=i===0;
    const p={lead:main?[4.9,6.2,3.8][di]:3+r()*5,cr1:.48+r()*.2,cr2:.6+r()*.18,cr3:.28+r()*.16,chk:22000+r()*10000,old:main?[52000,61000,44000][di]:35000+r()*40000};
    if(main){p.cr1=[.55,.63,.5][di];p.cr2=[.66,.72,.7][di];p.cr3=[.31,.39,.36][di];p.chk=[25500,24000,31000][di];}
    const pp=Object.assign({},p,{lead:p.lead*(main?1.12:1),cr3:p.cr3*(main?1.08:1)});   // прошлый месяц чуть лучше
    SCHOOLS.push({id:dir+i,name:main?['Школа А','Школа Б','Школа В'][di]:'Школа '+dir+' '+(i+1),dir,main,
      cur:genMonth(seed*3+1,CUR,p),prev:genMonth(seed*5+2,PREV,pp),
      plan:{leads:Math.round(p.lead*30*1.25/5)*5,rev:Math.round((p.lead*30*1.2*p.cr1*p.cr2*p.cr3*p.chk+p.old*30*1.05)/50000)*50000}});
  }
});

/* ---------- форматирование ---------- */
const nf0=new Intl.NumberFormat('ru-RU',{maximumFractionDigits:0});
const ok=v=>v!=null&&isFinite(v);
const rub=v=>ok(v)?nf0.format(Math.round(v))+' ₽':'н/д';
const num=v=>ok(v)?nf0.format(Math.round(v)):'н/д';
const mln=v=>!ok(v)?'н/д':(Math.abs(v)>=1e6?(v/1e6).toFixed(2).replace('.',',')+' млн ₽':nf0.format(Math.round(v/1000))+' тыс ₽');
const pc=(v,d=1)=>ok(v)?(v*100).toFixed(d).replace('.',',')+'%':'н/д';
const sgn=(v,f)=>(v>0?'+':v<0?'−':'')+f(Math.abs(v));
const pp=v=>ok(v)?sgn(v*100,x=>x.toFixed(1).replace('.',','))+' п.п.':'';
const RU_MG=['января','февраля','марта','апреля','мая','июня','июля','августа','сентября','октября','ноября','декабря'];
const RU_M=['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];

/* ---------- расчёт ---------- */
const sum=(a,n)=>{let t=0;for(let i=0;i<Math.min(n,a.length);i++)t+=a[i];return t;};
function agg(m,n){const L=sum(m.L,n),B=sum(m.B,n),M=sum(m.M,n),S=sum(m.S,n),NR=sum(m.NR,n),OR=sum(m.OR,n);
  return {L,B,M,S,NR,OR,rev:NR+OR,cr1:L?B/L:null,cr2:B?M/B:null,cr3:M?S/M:null,crT:L?S/L:null,chk:S?NR/S:null,rpl:L?NR/L:null};}
/** среднее по другим школам направления: объёмы - на одну школу, конверсии - по суммам (взвешенно) */
function dirAvg(s,n){const peers=SCHOOLS.filter(x=>x.dir===s.dir&&x.id!==s.id);const t={L:0,B:0,M:0,S:0,NR:0,OR:0};
  peers.forEach(x=>{const a=agg(x.cur,n);for(const k in t)t[k]+=a[k];});const k=peers.length;
  return Object.assign(agg({L:[t.L/k],B:[t.B/k],M:[t.M/k],S:[t.S/k],NR:[t.NR/k],OR:[t.OR/k]},1),{peers:k});}
function bases(s){
  const ref=DIRS[s.dir].ref;
  return {
    prev:Object.assign(agg(s.prev,D),{label:'Прошлый месяц',short:'прош. мес.',note:'1-'+D+' '+RU_MG[PREV.m]}),
    dir: Object.assign(dirAvg(s,D),{label:'Направление',short:'направл.',note:'среднее по '+dirAvg(s,D).peers+' школам «'+s.dir+'», 1-'+D+' '+RU_MG[CUR.m]}),
    ref: {cr1:ref.cr1,cr2:ref.cr2,cr3:ref.cr3,crT:ref.cr1*ref.cr2*ref.cr3,chk:ref.chk,rpl:ref.cr1*ref.cr2*ref.cr3*ref.chk,label:'Эталон',short:'эталон',note:'идеальные значения направления «'+s.dir+'»',noAbs:true},
  };
}
/** План на сегодня (равномерно по дням) и разложение отклонения выручки по факторам (цепные подстановки). */
function planGap(s,f,t){
  const kD=D/CUR.n, Lp=s.plan.leads*kD, Rp=s.plan.rev*kD;
  const newT=Lp*t.cr1*t.cr2*t.cr3*t.chk, oldT=Math.max(0,Rp-newT);
  const f1=Lp*t.cr1*t.cr2*t.cr3*(f.chk-t.chk);           // средний чек
  const f2=Lp*t.cr1*t.cr2*(f.cr3-t.cr3)*f.chk;            // встреча -> продажа
  const f3=Lp*t.cr1*(f.cr2-t.cr2)*f.cr3*f.chk;            // постановка -> встреча
  const f4=Lp*(f.cr1-t.cr1)*f.cr2*f.cr3*f.chk;            // лид -> постановка
  const f5=(f.L-Lp)*f.cr1*f.cr2*f.cr3*f.chk;              // лиды (при текущих конверсиях и чеке)
  const f6=f.OR-oldT;                                     // продажи текущим ученикам
  return {Lp,Rp,newT,oldT,factors:[
    {k:'L',  name:'Лиды',                    v:f5,how:'(лиды факт − лиды план) × текущие конверсии × текущий чек'},
    {k:'cr1',name:'Лид → постановка',        v:f4,how:'лиды план × (CR факт − CR цель) × текущие следующие конверсии × чек'},
    {k:'cr2',name:'Постановка → встреча',    v:f3,how:'лиды план × CR1 цель × (CR факт − CR цель) × текущие CR3 и чек'},
    {k:'cr3',name:'Встреча → продажа',       v:f2,how:'лиды план × CR1, CR2 цель × (CR факт − CR цель) × текущий чек'},
    {k:'chk',name:'Средний чек',             v:f1,how:'плановые первые продажи × (чек факт − чек цель)'},
    {k:'old',name:'Продажи текущим ученикам',v:f6,how:'старые продажи факт − (план выручки − новые продажи по цели)'}]};
}

/* ---------- DOM и тултип ---------- */
function h(tag,attrs,...kids){const e=document.createElement(tag);if(attrs)for(const k in attrs){const v=attrs[k];if(v==null||v===false)continue;if(k==='class')e.className=v;else if(k==='text')e.textContent=v;else if(k==='style')e.style.cssText=v;else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);else e.setAttribute(k,v);}for(const c of kids.flat()){if(c==null||c===false)continue;e.appendChild(typeof c==='string'||typeof c==='number'?document.createTextNode(String(c)):c);}return e;}
const SVGNS='http://www.w3.org/2000/svg';
function sv(tag,attrs,parent){const e=document.createElementNS(SVGNS,tag);for(const k in attrs)e.setAttribute(k,attrs[k]);if(parent)parent.appendChild(e);return e;}
function txt(p,x,y,str,a){const t=sv('text',Object.assign({x,y},a||{}),p);t.textContent=str;return t;}
const tip=document.getElementById('tip');
function showTip(ev,title,rows){tip.textContent='';tip.appendChild(h('div',{class:'t',text:title}));
  for(const r of rows){tip.appendChild(h('div',{class:'r'},h('span',{class:'k'},r.color?h('span',{class:r.rect?'key-rect':'key-line',style:(r.rect?'background:':'border-color:')+r.color}):null,r.label),h('b',{text:r.value})));}
  tip.style.display='block';const w=tip.offsetWidth,hh=tip.offsetHeight;let x=ev.clientX+14,y=ev.clientY+14;if(x+w>innerWidth-8)x=ev.clientX-w-14;if(y+hh>innerHeight-8)y=ev.clientY-hh-14;tip.style.left=x+'px';tip.style.top=y+'px';}
const hideTip=()=>tip.style.display='none';
const hover=(el,fn)=>{el.addEventListener('pointermove',ev=>{const t=fn();showTip(ev,t.title,t.rows);});el.addEventListener('pointerleave',hideTip);return el;};
function chip(delta,goodIfUp,fmt){if(!ok(delta)||Math.abs(delta)<1e-9)return h('span',{class:'chip small',text:'='});const good=(delta>0)===goodIfUp;
  return h('span',{class:'chip '+(good?'up':'down')},h('span',{class:'ic',text:delta>0?'▲':'▼'}),fmt(delta));}
const tile=(lbl,val,cls,det)=>h('div',{class:'tile'},h('div',{class:'lbl',text:lbl}),h('div',{class:'val'+(cls?' '+cls:''),text:val}),h('div',{class:'det'},...det.map(d=>h('div',{},d))));

/* ---------- состояние ---------- */
const state={school:SCHOOLS.find(x=>x.main).id,cmp:'ref',target:'ref'};

/* ---------- 1. План и факт ---------- */
function renderPlan(main,s,f,gap){
  const kD=D/CUR.n, fcR=f.rev/kD, fcL=f.L/kD;
  const dR=f.rev-gap.Rp, dL=f.L-gap.Lp;
  main.appendChild(h('h2',{text:'План и факт на '+D+' '+RU_MG[CUR.m]+' · накопительно'}));
  main.appendChild(h('p',{class:'sub',text:'План на сегодня = план месяца × '+D+'/'+CUR.n+' дней. Прогноз месяца - по темпу 1-'+D+' числа.'}));
  main.appendChild(h('div',{class:'grid-tiles four'},
    tile('Выручка: факт 1-'+D,mln(f.rev),'',['план на сегодня '+mln(gap.Rp),h('span',{},chip(dR,true,v=>mln(v)),' ',pc(gap.Rp?dR/gap.Rp:null,1))]),
    tile('Лиды: факт 1-'+D,num(f.L),'',['план на сегодня '+num(gap.Lp),h('span',{},chip(dL,true,v=>num(v)),' ',pc(gap.Lp?dL/gap.Lp:null,1))]),
    tile(dR<0?'Не хватает выручки до плана на сегодня':'Выручка сверх плана на сегодня',mln(Math.abs(dR)),dR<0?'neg':'pos',['разложение по причинам - ниже, в «Где потеряны деньги»']),
    tile('Прогноз выручки на '+RU_M[CUR.m],mln(fcR),fcR<s.plan.rev?'neg':'pos',['план месяца '+mln(s.plan.rev)+' · '+pc(fcR/s.plan.rev,0),'лиды: прогноз '+num(fcL)+' из '+num(s.plan.leads)])));
  // накопительные графики: выручка и лиды (две отдельные шкалы - два графика)
  const grid=h('div',{class:'twocol'});main.appendChild(grid);
  const cumul=(a,n)=>{const o=[];let t=0;for(let i=0;i<n;i++){t+=a[i];o.push(t);}return o;};
  const revDaily=s.cur.NR.map((v,i)=>v+s.cur.OR[i]);
  lineCard(grid,'Выручка накопительно, ₽','новые + старые продажи',cumul(revDaily,D),s.plan.rev,mln);
  lineCard(grid,'Лиды накопительно','',cumul(s.cur.L,D),s.plan.leads,num);
}
function lineCard(host,title,sub,fact,planMonth,fmt){
  const card=h('div',{class:'card'},h('h3',{text:title}),sub?h('p',{class:'sub',text:sub}):null,
    h('div',{class:'legend'},h('span',{},h('span',{class:'key-line',style:'border-color:var(--s1)'}),'факт'),h('span',{},h('span',{class:'key-line',style:'border-color:var(--s1);border-top-style:dashed'}),'прогноз по темпу'),h('span',{},h('span',{class:'key-line',style:'border-color:var(--ink-2);border-top-style:dashed'}),'план (равномерно)')));
  const box=h('div',{class:'chart'});card.appendChild(box);host.appendChild(card);
  requestAnimationFrame(()=>{
    const W=Math.max(box.clientWidth,360),H=230,m={l:64,r:70,t:10,b:28},pw=W-m.l-m.r,ph=H-m.t-m.b,N=CUR.n;
    const fc=fact[D-1]/D*N, top=Math.max(planMonth,fc)*1.08;
    const X=d=>m.l+(d-1)/(N-1)*pw, Y=v=>m.t+ph-v/top*ph;
    const svg=sv('svg',{viewBox:`0 0 ${W} ${H}`,height:H,role:'img','aria-label':title},box);
    const st=Math.pow(10,Math.floor(Math.log10(top/4)));const step=[1,2,2.5,5,10].map(x=>x*st).find(x=>top/x<=5);
    for(let v=0;v<=top;v+=step){sv('line',{x1:m.l,x2:m.l+pw,y1:Y(v),y2:Y(v),stroke:'var(--grid)'},svg);txt(svg,m.l-8,Y(v)+4,v>=1e6?(v/1e6).toFixed(1).replace('.',',')+' млн':v>=1e3?nf0.format(v/1e3)+' тыс':nf0.format(v),{'text-anchor':'end'});}
    [1,5,10,15,20,25,N].forEach(d=>txt(svg,X(d),H-8,String(d),{'text-anchor':'middle'}));
    sv('line',{x1:X(1),y1:Y(planMonth/N),x2:X(N),y2:Y(planMonth),stroke:'var(--ink-2)','stroke-width':2,'stroke-dasharray':'5 4'},svg);
    sv('path',{d:fact.map((v,i)=>(i?'L':'M')+X(i+1)+','+Y(v)).join(''),fill:'none',stroke:'var(--s1)','stroke-width':2,'stroke-linejoin':'round','stroke-linecap':'round'},svg);
    sv('line',{x1:X(D),y1:Y(fact[D-1]),x2:X(N),y2:Y(fc),stroke:'var(--s1)','stroke-width':2,'stroke-dasharray':'4 4'},svg);
    sv('circle',{cx:X(D),cy:Y(fact[D-1]),r:4.5,fill:'var(--s1)',stroke:'var(--surface)','stroke-width':2},svg);
    txt(svg,X(N)+6,Y(planMonth)+4,'план',{});txt(svg,X(N)+6,Y(fc)+(Math.abs(Y(fc)-Y(planMonth))<14?16:4),'прогноз',{});
    const cross=sv('line',{y1:m.t,y2:m.t+ph,stroke:'var(--axis)',opacity:0},svg);
    const ov=sv('rect',{x:m.l,y:m.t,width:pw,height:ph,fill:'transparent'},svg);
